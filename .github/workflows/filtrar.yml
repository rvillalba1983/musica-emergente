# Filtra los candidatos de la semana según criterios editoriales (sin IA).
name: Filtrar candidatos

on:
  workflow_dispatch:
    inputs:
      ventana_desde:
        description: "Desde (AAAA-MM-DD). Vacío = fecha_entrada − 7 días de data/candidatos.json"
        required: false
      ventana_hasta:
        description: "Hasta (AAAA-MM-DD). Vacío = fecha_entrada + 15 días"
        required: false

permissions:
  contents: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  filtrar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Calcular ventana si no se dio
        id: ventana
        run: |
          if [ -z "${{ github.event.inputs.ventana_desde }}" ] || [ -z "${{ github.event.inputs.ventana_hasta }}" ]; then
            DE=$(python3 -c "import json,datetime as dt;d=json.load(open('data/candidatos.json'));f=dt.date.fromisoformat(d['fecha_entrada']);print((f-dt.timedelta(days=7)).isoformat())")
            HA=$(python3 -c "import json,datetime as dt;d=json.load(open('data/candidatos.json'));f=dt.date.fromisoformat(d['fecha_entrada']);print((f+dt.timedelta(days=15)).isoformat())")
            echo "desde=$DE" >> $GITHUB_OUTPUT
            echo "hasta=$HA" >> $GITHUB_OUTPUT
          else
            echo "desde=${{ github.event.inputs.ventana_desde }}" >> $GITHUB_OUTPUT
            echo "hasta=${{ github.event.inputs.ventana_hasta }}" >> $GITHUB_OUTPUT
          fi

      - name: Filtrar
        run: |
          echo "Ventana: ${{ steps.ventana.outputs.desde }} → ${{ steps.ventana.outputs.hasta }}"
          python3 scripts/filtrar_criterios.py data/candidatos.json "${{ steps.ventana.outputs.desde }}" "${{ steps.ventana.outputs.hasta }}" data/candidatos_filtrados.json

      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/candidatos_filtrados.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Candidatos filtrados (automático)"
          git pull --rebase origin main
          git push origin HEAD:main
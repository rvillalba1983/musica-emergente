name: Entrada Semanal IA

on:
  schedule:
    - cron: "17 5 * * 5"    # viernes 05:17 UTC
  workflow_dispatch:
    inputs:
      modelo:
        description: "Modelo a usar (ej. gpt-4o-mini, claude-3-5-sonnet-20241022)"
        required: false
        default: "gpt-4o-mini"
      fecha:
        description: "Fecha de publicación (AAAA-MM-DD). Vacío = próximo viernes"
        required: false

permissions:
  contents: read
  issues: write
  models: read

concurrency:
  group: entrada-semanal
  cancel-in-progress: false

jobs:
  generar_entrada:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python3 -m pip install --upgrade pip
          pip install requests

      - name: Leer candidatos
        id: candidatos
        run: |
          if [ -f data/candidatos_filtrados.json ]; then
            echo "archivo=data/candidatos_filtrados.json" >> $GITHUB_OUTPUT
          else
            echo "archivo=data/candidatos.json" >> $GITHUB_OUTPUT
          fi

      - name: Generar entrada con IA (o local)
        id: generar
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODEL: ${{ github.event.inputs modelo || 'gpt-4o-mini' }}
        run: |
          python3 scripts/ia_generar.py \
            --entrada "${{ steps.candidatos.outputs.archivo }}" \
            --salida /tmp/entrada_ia.json \
            --fecha "${{ github.event.inputs.fecha || '' }}"

      - name: Validar entrada suelta
        run: |
          if [ ! -f /tmp/entrada_ia.json ]; then
            echo "❌ No se generó /tmp/entrada_ia.json"
            exit 1
          fi
          python3 scripts/validar_entrada.py /tmp/entrada_ia.json

      - name: Subir entrada como artifact
        uses: actions/upload-artifact@v4
        with:
          name: entrada-semanal-${{ github.run_id }}
          path: /tmp/entrada_ia.json

      - name: Crear issue con la entrada generada
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ia_crear_issue.py